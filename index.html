<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2185B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BerryLife">
<title>BerryLife 🍓 — seu Life OS pessoal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --berry:#C2185B;
    --berry-dark:#8E1249;
    --berry-mid:#E24777;
    --berry-light:#F8CFDE;
    --pink-bg:#FFF3F6;
    --pink-card:#FFEAF1;
    --pink-card-2:#FFF7FA;
    --white:#FFFFFF;
    --text:#4A2C3A;
    --text-soft:#9C7387;
    --text-faint:#C7A5B4;
    --mint:#7FCBA4;
    --mint-bg:#E7F7EF;
    --gold:#F4B740;
    --gold-bg:#FFF3DC;
    --danger:#E0577B;
    --danger-bg:#FDE7ED;
    --shadow-sm:0 2px 10px rgba(194,24,91,0.07);
    --shadow-md:0 10px 26px rgba(194,24,91,0.12);
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--pink-bg); color:var(--text); font-family:'Nunito',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4,.display{font-family:'Baloo 2',cursive; font-weight:700; margin:0;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--berry-light);}

  #app{max-width:1180px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:96px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 10px;
  }
  .brand{display:flex; align-items:center; gap:8px;}
  .brand-mark{
    width:38px; height:38px; border-radius:12px;
    background:linear-gradient(145deg,var(--berry-mid),var(--berry));
    display:flex; align-items:center; justify-content:center; font-size:20px;
    box-shadow:var(--shadow-sm);
  }
  .brand-name{font-family:'Baloo 2'; font-weight:800; font-size:19px; color:var(--berry-dark); letter-spacing:.2px;}
  .level-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--white); border:1.5px solid var(--gold-bg);
    padding:7px 12px 7px 8px; border-radius:999px; box-shadow:var(--shadow-sm);
    font-weight:700; font-size:13px; color:var(--berry-dark);
  }
  .level-chip .dot{width:24px;height:24px;border-radius:50%;background:var(--gold-bg); display:flex;align-items:center;justify-content:center;font-size:13px;}

  .hero{padding:6px 20px 4px;}
  .hero h1{font-size:26px; color:var(--berry-dark); line-height:1.25;}
  .hero .sub{color:var(--text-soft); font-size:14.5px; margin-top:4px; font-weight:600;}

  /* ---------- Layout / grid ---------- */
  .content{padding:14px 20px 30px;}
  .grid2{display:grid; grid-template-columns:1fr; gap:14px;}
  @media(min-width:760px){
    .grid2{grid-template-columns:1fr 1fr;}
    .grid3{grid-template-columns:1fr 1fr 1fr !important;}
    .dash-wide{grid-column: 1 / -1;}
  }

  /* ---------- Cards ---------- */
  .card{
    background:var(--white); border-radius:var(--radius-lg); padding:18px;
    box-shadow:var(--shadow-sm); border:1px solid #FBE3EC;
  }
  .card.soft{background:var(--pink-card); border:1px solid #FBD9E6;}
  .card-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .card-title h3{font-size:16px; color:var(--berry-dark); display:flex; align-items:center; gap:8px;}
  .card-title .muted{font-size:12.5px; color:var(--text-faint); font-weight:700;}

  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
  .stat-box{
    background:var(--pink-card-2); border-radius:var(--radius-md); padding:12px 10px; text-align:center;
    border:1px solid #FBE3EC;
  }
  .stat-box .num{font-family:'Baloo 2'; font-size:21px; font-weight:800; color:var(--berry);}
  .stat-box .lbl{font-size:11.5px; color:var(--text-soft); font-weight:700; margin-top:2px;}

  .progress-track{background:#FBE3EC; border-radius:999px; height:12px; overflow:hidden; position:relative;}
  .progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--berry-mid),var(--berry)); transition:width .5s ease;}
  .progress-fill.mint{background:linear-gradient(90deg,#9FDDBE,var(--mint));}
  .progress-fill.gold{background:linear-gradient(90deg,#FBD077,var(--gold));}
  .progress-label{display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--text-soft); margin-top:6px;}

  .quote-card{
    background:linear-gradient(135deg,var(--berry-mid),var(--berry-dark)); color:#fff;
    border-radius:var(--radius-lg); padding:18px 20px; box-shadow:var(--shadow-md); position:relative; overflow:hidden;
  }
  .quote-card:before{content:"🍓"; position:absolute; right:-6px; bottom:-14px; font-size:74px; opacity:.18;}
  .quote-card p.q{font-size:15px; font-weight:700; line-height:1.5; padding-right:30px;}
  .quote-refresh{
    margin-top:10px; background:rgba(255,255,255,.18); border:none; color:#fff; font-weight:800;
    font-size:12px; padding:6px 12px; border-radius:999px;
  }

  /* buttons */
  .btn{
    border:none; border-radius:999px; padding:11px 18px; font-weight:800; font-size:13.5px;
    display:inline-flex; align-items:center; gap:6px; box-shadow:var(--shadow-sm);
  }
  .btn-primary{background:linear-gradient(135deg,var(--berry-mid),var(--berry)); color:#fff;}
  .btn-ghost{background:var(--pink-card); color:var(--berry-dark);}
  .btn-mint{background:var(--mint-bg); color:#2E7D57;}
  .btn-block{width:100%; justify-content:center;}
  .btn-sm{padding:7px 12px; font-size:12px;}
  .icon-btn{
    width:32px; height:32px; border-radius:10px; border:none; background:var(--pink-card);
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--berry-dark);
  }
  .fab{
    position:fixed; right:20px; bottom:96px; width:54px; height:54px; border-radius:18px; border:none;
    background:linear-gradient(135deg,var(--berry-mid),var(--berry-dark)); color:#fff; font-size:24px;
    box-shadow:0 10px 22px rgba(142,18,73,.35); z-index:40;
  }

  /* section header w/ add button */
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .section-head h2{font-size:21px; color:var(--berry-dark);}

  /* chips / filters */
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
  .chip{
    flex:0 0 auto; padding:8px 14px; border-radius:999px; background:var(--white); border:1.5px solid #F5D3E1;
    font-weight:700; font-size:12.5px; color:var(--text-soft); white-space:nowrap;
  }
  .chip.active{background:var(--berry); color:#fff; border-color:var(--berry);}

  /* list items */
  .list{display:flex; flex-direction:column; gap:10px;}
  .item{
    background:var(--white); border-radius:var(--radius-md); padding:13px 14px; display:flex; align-items:center; gap:12px;
    box-shadow:var(--shadow-sm); border:1px solid #FBE3EC;
  }
  .item.done{opacity:.55;}
  .check{
    width:26px; height:26px; min-width:26px; border-radius:50%; border:2px solid var(--berry-light); background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent;
  }
  .check.checked{background:var(--berry); border-color:var(--berry); color:#fff;}
  .item-body{flex:1; min-width:0;}
  .item-title{font-weight:800; font-size:14.5px; color:var(--text);}
  .item-title.strike{text-decoration:line-through; color:var(--text-faint);}
  .item-meta{display:flex; gap:6px; margin-top:5px; flex-wrap:wrap;}
  .tag{font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px;}
  .tag-faculdade{background:#E8ECFF; color:#4C5FD6;}
  .tag-trabalho{background:#FFEBD6; color:#C77A18;}
  .tag-pessoal{background:var(--mint-bg); color:#2E7D57;}
  .tag-financeiro{background:var(--gold-bg); color:#A9740B;}
  .tag-academico{background:#E8ECFF; color:#4C5FD6;}
  .tag-profissional{background:#FFEBD6; color:#C77A18;}
  .prio{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px;}
  .prio-alta{background:var(--danger);}
  .prio-media{background:var(--gold);}
  .prio-baixa{background:var(--mint);}
  .item-actions{display:flex; gap:6px;}
  .empty{
    text-align:center; padding:34px 16px; color:var(--text-soft); font-weight:700; font-size:13.5px;
    background:var(--pink-card-2); border-radius:var(--radius-md); border:1.5px dashed #F3C9DA;
  }
  .empty .big{font-size:34px; display:block; margin-bottom:8px;}

  /* forms / modal */
  .overlay{
    position:fixed; inset:0; background:rgba(74,44,58,.35); display:flex; align-items:flex-end; justify-content:center;
    z-index:100; backdrop-filter:blur(2px);
  }
  @media(min-width:640px){ .overlay{align-items:center;} }
  .sheet{
    background:#fff; width:100%; max-width:480px; border-radius:26px 26px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto; box-shadow:0 -10px 30px rgba(0,0,0,.15);
    animation:slideUp .22s ease;
  }
  @media(min-width:640px){ .sheet{border-radius:26px; max-height:82vh;} }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-title{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .sheet-title h3{font-size:18px; color:var(--berry-dark);}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12.5px; font-weight:800; color:var(--text-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 13px; border-radius:14px; border:1.6px solid #F3D6E3; background:var(--pink-card-2);
    font-size:14px; color:var(--text); font-weight:600;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--berry-mid);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .close-x{background:var(--pink-card); border:none; width:30px; height:30px; border-radius:10px; font-size:14px; color:var(--berry-dark);}

  /* bottom nav */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #FBE3EC;
    display:flex; justify-content:space-around; padding:9px 6px calc(9px + env(safe-area-inset-bottom)); z-index:50;
    box-shadow:0 -4px 18px rgba(194,24,91,.06);
  }
  .nav-btn{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--text-faint); font-size:10.5px; font-weight:800; padding:4px 8px; border-radius:12px; min-width:52px;
  }
  .nav-btn .ic{font-size:19px;}
  .nav-btn.active{color:var(--berry);}
  .nav-btn.active .ic{transform:scale(1.08);}

  /* more sheet grid */
  .more-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .more-item{
    background:var(--pink-card-2); border-radius:var(--radius-md); padding:16px 12px; text-align:center;
    border:1px solid #FBE3EC; font-weight:800; font-size:13px; color:var(--berry-dark);
  }
  .more-item .ic{font-size:24px; display:block; margin-bottom:6px;}

  /* toast */
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--berry-dark); color:#fff;
    padding:10px 18px; border-radius:999px; font-weight:800; font-size:13px; box-shadow:var(--shadow-md);
    z-index:200; animation:toastIn .25s ease, toastOut .3s ease 1.7s forwards;
  }
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,-8px);} to{opacity:1; transform:translate(-50%,0);}}
  @keyframes toastOut{to{opacity:0; transform:translate(-50%,-8px);}}

  /* mini bar chart */
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .bar-row .lbl{width:110px; font-size:12.5px; font-weight:700; color:var(--text-soft); flex-shrink:0;}
  .bar-track{flex:1; background:#FBE3EC; border-radius:999px; height:10px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--berry-mid),var(--berry));}
  .bar-val{width:40px; text-align:right; font-size:12px; font-weight:800; color:var(--berry-dark);}

  .kv-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #FBEEF3; font-size:13.5px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row .k{color:var(--text-soft); font-weight:700;}
  .kv-row .v{font-weight:800; color:var(--text);}
  .v.pos{color:#2E7D57;} .v.neg{color:var(--danger);}

  .switch{position:relative; width:44px; height:25px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .slider-tog{position:absolute; inset:0; background:#F3D6E3; border-radius:999px; transition:.2s;}
  .slider-tog:before{content:""; position:absolute; width:19px; height:19px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 4px rgba(0,0,0,.2);}
  .switch input:checked + .slider-tog{background:var(--berry);}
  .switch input:checked + .slider-tog:before{transform:translateX(19px);}
  .settings-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #FBEEF3;}
  .settings-row:last-child{border-bottom:none;}
  .settings-row .t{font-weight:800; font-size:14px;}
  .settings-row .d{font-size:12px; color:var(--text-soft); font-weight:600; margin-top:2px;}

  .app-footer{text-align:center; padding:6px 20px 20px; color:var(--text-faint); font-size:11.5px; font-weight:700;}
  .scroller::-webkit-scrollbar{display:none;}

  /* ======== v2: refinamentos de design ======== */
  :root{ --line:#F6DCE7; --ring:0 0 0 4px rgba(226,71,119,.15); }
  body{background:
    radial-gradient(1200px 500px at 100% -10%, #FFE1EC 0%, transparent 60%),
    radial-gradient(900px 400px at -10% 110%, #FFEFF4 0%, transparent 60%), var(--pink-bg); background-attachment:fixed;}
  .card,.item{border-color:var(--line); transition:transform .15s ease, box-shadow .15s ease;}
  @media(hover:hover){ .item:hover{transform:translateY(-1px); box-shadow:var(--shadow-md);} .btn:hover{filter:brightness(1.04);} .chip:hover{border-color:var(--berry-mid);} }
  .btn{transition:transform .1s ease, filter .15s ease;} .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.6; cursor:not-allowed;}
  .field input:focus,.field select:focus,.field textarea:focus{box-shadow:var(--ring);}
  .btn-danger{background:var(--danger); color:#fff;}
  .topbar-right{display:flex; align-items:center; gap:8px;}
  .avatar{width:38px; height:38px; border-radius:50%; border:none; background:linear-gradient(145deg,#FFD3E2,#F8A9C4);
    color:var(--berry-dark); font-family:'Baloo 2'; font-weight:800; font-size:16px; box-shadow:var(--shadow-sm); position:relative;}
  .sync-dot{position:absolute; right:-1px; bottom:-1px; width:12px; height:12px; border-radius:50%; border:2px solid #fff; background:var(--mint);}
  .sync-dot.saving{background:var(--gold);} .sync-dot.offline{background:#BBA3AE;} .sync-dot.error{background:var(--danger);}
  .acct-head{display:flex; gap:12px; align-items:center; padding:4px 0 14px; border-bottom:1px solid var(--line); margin-bottom:12px;}
  .acct-head .avatar{width:48px; height:48px; font-size:20px;}
  .acct-name{font-weight:800; font-size:15px;} .acct-mail{font-size:12.5px; color:var(--text-soft); font-weight:600;}
  .dialog-msg{font-size:14px; color:var(--text); font-weight:600; line-height:1.5; margin-bottom:18px;}
  .dialog-actions{display:flex; gap:10px; justify-content:flex-end;}

  /* nav: extras só no desktop */
  .nav-extra{display:none;}
  .nav-brand{display:none;}
  @media(min-width:960px){
    .bottom-nav{top:0; bottom:0; right:auto; width:236px; flex-direction:column; justify-content:flex-start; gap:4px;
      padding:22px 14px; border-top:none; border-right:1px solid var(--line); box-shadow:none; background:rgba(255,255,255,.85); backdrop-filter:blur(8px);}
    .nav-brand{display:flex; align-items:center; gap:8px; padding:0 8px 18px;}
    .nav-btn{flex-direction:row; justify-content:flex-start; gap:12px; font-size:14px; padding:11px 14px; width:100%; color:var(--text-soft); border-radius:14px;}
    .nav-btn .ic{font-size:18px;}
    .nav-btn.active{background:var(--pink-card); color:var(--berry-dark);}
    .nav-btn:hover{background:var(--pink-card-2);}
    .nav-extra{display:flex;} .nav-more{display:none;}
    .nav-sep{display:block; height:1px; background:var(--line); margin:8px 8px;}
    #app{margin-left:236px; max-width:none; padding:0 18px 40px;}
    .topbar .brand{visibility:hidden;}
    .fab{bottom:28px; right:28px;}
  }
  .nav-sep{display:none;}

  /* ======== Tela de login / cadastro ======== */
  #authRoot{position:fixed; inset:0; z-index:300; overflow-y:auto; display:none;
    background:radial-gradient(800px 500px at 0% 0%, #FFD6E5 0%, transparent 60%), radial-gradient(700px 500px at 100% 100%, #FFE7EF 0%, transparent 60%), #FFF5F8;}
  #authRoot.show{display:flex; align-items:center; justify-content:center; padding:24px 16px;}
  .auth-wrap{width:100%; max-width:960px; display:grid; grid-template-columns:1fr; background:#fff; border-radius:30px; overflow:hidden;
    box-shadow:0 30px 70px rgba(142,18,73,.16); border:1px solid var(--line);}
  @media(min-width:860px){ .auth-wrap{grid-template-columns:1.05fr 1fr;} }
  .auth-side{display:none; position:relative; overflow:hidden; color:#fff; padding:44px 40px;
    background:linear-gradient(150deg,#E24777 0%,#C2185B 55%,#8E1249 100%);}
  @media(min-width:860px){ .auth-side{display:flex; flex-direction:column; justify-content:space-between;} }
  .auth-side:after{content:"🍓"; position:absolute; right:-30px; bottom:-40px; font-size:220px; opacity:.13; transform:rotate(-12deg);}
  .auth-side .brand-mark{background:rgba(255,255,255,.2);}
  .auth-side .brand-name{color:#fff;}
  .auth-side h2{font-size:34px; line-height:1.15; margin:28px 0 10px;}
  .auth-side p.lead{font-size:15px; opacity:.9; font-weight:600; line-height:1.55; max-width:360px;}
  .feat{display:flex; gap:12px; align-items:center; margin-top:14px; font-weight:700; font-size:14px;}
  .feat span{width:36px; height:36px; border-radius:12px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:17px;}
  .auth-form{padding:34px 28px 28px;}
  @media(min-width:860px){ .auth-form{padding:48px 44px;} }
  .auth-mobile-brand{display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:18px;}
  @media(min-width:860px){ .auth-mobile-brand{display:none;} }
  .auth-form h3{font-size:26px; color:var(--berry-dark);}
  .auth-form .hint{color:var(--text-soft); font-weight:600; font-size:14px; margin:4px 0 22px;}
  .seg{display:grid; grid-template-columns:1fr 1fr; background:var(--pink-card); border-radius:999px; padding:4px; margin-bottom:22px;}
  .seg button{border:none; background:none; padding:10px; border-radius:999px; font-weight:800; font-size:13.5px; color:var(--text-soft);}
  .seg button.on{background:#fff; color:var(--berry-dark); box-shadow:var(--shadow-sm);}
  .pw-wrap{position:relative;}
  .pw-wrap button{position:absolute; right:8px; top:50%; transform:translateY(-50%); border:none; background:none; font-size:15px; padding:6px; color:var(--text-soft);}
  .auth-msg{font-size:13px; font-weight:700; padding:10px 12px; border-radius:12px; margin-bottom:14px; display:none;}
  .auth-msg.err{display:block; background:var(--danger-bg); color:#B3264F;}
  .auth-msg.ok{display:block; background:var(--mint-bg); color:#2E7D57;}
  .link-btn{border:none; background:none; color:var(--berry); font-weight:800; font-size:13px; padding:4px 0;}
  .auth-or{display:flex; align-items:center; gap:10px; color:var(--text-faint); font-size:12px; font-weight:800; margin:20px 0 14px;}
  .auth-or:before,.auth-or:after{content:""; flex:1; height:1px; background:var(--line);}
  .auth-foot{font-size:11.5px; color:var(--text-faint); font-weight:700; text-align:center; margin-top:18px; line-height:1.5;}
  .pw-meter{height:5px; border-radius:999px; background:#F6E3EA; overflow:hidden; margin-top:6px;}

function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }

/* =========================================================
   XP / GAMIFICAÇÃO
========================================================= */
function levelInfo(){
  const xp = state.user.xp;
  const level = Math.floor(xp/100)+1;
  const cur = xp % 100;
  return {level, cur, next:100};
}
function gainXP(n, msg){
  const before = levelInfo().level;
  state.user.xp += n;
  touchStreak();
  showToast(msg || `+${n} XP ✨`);
  const after = levelInfo().level;
  checkAchievements();
  checkMissions();
  if(after > before) setTimeout(()=>showLevelUp(after), 400);
}

function logHistory(icon, text){
  state.history.unshift({id:uid(), icon, text, date: todayISO(), time: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
}
function clearHistory(){
  state.history = [];
  render(); showToast('Histórico limpo 🧹');
}

function showToast(text){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  root.innerHTML = '';
  root.appendChild(el);
  setTimeout(()=>{ if(root.contains(el)) root.removeChild(el); }, 2000);
}

/* =========================================================
   HELPERS DE DADOS
========================================================= */
function catTag(cat){
  const map = {
    faculdade:['tag-faculdade','🎓 Faculdade'], trabalho:['tag-trabalho','💼 Trabalho'],
    pessoal:['tag-pessoal','🌸 Pessoal'], financeiro:['tag-financeiro','💰 Financeiro'],
    academico:['tag-academico','🎓 Acadêmico'], profissional:['tag-profissional','💼 Profissional'],
  };
  const [cls,label] = map[cat] || ['tag-pessoal', cat];
  return `<span class="tag ${cls}">${label}</span>`;
}
function prioDot(p){
  const map={alta:'prio-alta',media:'prio-media',baixa:'prio-baixa'};
  const label={alta:'Alta',media:'Média',baixa:'Baixa'};
  return `<span class="tag" style="background:#F8EEF2;color:var(--text-soft)"><span class="prio ${map[p]}"></span>${label[p]}</span>`;
}
function financeTotals(){
  const f = state.finance;
  const entradas = f.transactions.filter(t=>t.type==='entrada').reduce((s,t)=>s+t.amount,0);
  const saidas = f.transactions.filter(t=>t.type==='saida').reduce((s,t)=>s+t.amount,0);
  const fixos = f.fixed.reduce((s,x)=>s+x.amount,0);
  const invest = f.investments.reduce((s,x)=>s+x.amount,0);
  const balance = entradas - saidas - fixos;
  return {entradas, saidas, fixos, invest, balance};
}

function goTab(id){
  if(id==='mais'){ openMoreSheet(); return; }
  state.tab = id;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function render(){
  renderHeader();
  renderNav();
  const c = document.getElementById('content');
  const views = {
    inicio: viewInicio, tarefas: viewTarefas, agenda: viewAgenda,
    faculdade: viewFaculdade, trabalho: viewTrabalho, financas: viewFinancas,
    metas: viewMetas, relatorios: viewRelatorios, config: viewConfig, historico: viewHistorico,
    saude: viewSaude, conquistas: viewConquistas,
  };
  c.innerHTML = (views[state.tab] || viewInicio)();
  applyTheme();
  renderMascotFab();
  saveState();
}

function renderHeader(){
  const {level, cur} = levelInfo();
  document.getElementById('levelChip').innerHTML = `<span class="dot">⭐</span> Nív. ${level}<span class="lc-xp"> · ${cur}/100</span>${streakInfo().count? ` · 🔥${streakInfo().count}`:''}`;
  const av = document.getElementById('avatarBtn');
  if(av){ av.firstChild.nodeValue = (state.user.name||'?').trim().charAt(0).toUpperCase() || '?'; }
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Bom dia' : hour < 18 ? 'Boa tarde' : 'Boa noite';
  const titles = {
    inicio:null, tarefas:'Tarefas', agenda:'Agenda', faculdade:'Faculdade',
    trabalho:'Trabalho & Carreira', financas:'Finanças', metas:'Metas', relatorios:'Relatórios', config:'Configurações', historico:'Histórico', saude:'Saúde & Academia', conquistas:'Conquistas'
  };
  const t = titles[state.tab];
  document.getElementById('heroBlock').innerHTML = t ? `
    <h1>${t}</h1>
  ` : `
    <h1>${greet}${state.user.name ? ', '+esc(state.user.name) : ''}! 👋</h1>
    <p class="sub">${new Date().toLocaleDateString('pt-BR',{weekday:'long', day:'numeric', month:'long'})}</p>
  `;
}

function renderNav(){
  const nav = document.getElementById('bottomNav');
  const moreIds = MORE_ITEMS.map(m=>m.id);
  const btn = (t, cls='') => {
    const active = (t.id===state.tab) || (t.id==='mais' && moreIds.includes(state.tab));
    return `<button class="nav-btn ${cls} ${active?'active':''}" onclick="goTab('${t.id}')"><span class="ic">${t.icon}</span>${t.label}</button>`;
  };
  nav.innerHTML = `<div class="nav-brand"><div class="brand-mark">🍓</div><div class="brand-name">BerryLife</div></div>`
    + TABS.map(t => btn(t, t.id==='mais' ? 'nav-more' : '')).join('')
    + `<span class="nav-sep"></span>`
    + MORE_ITEMS.map(m => btn(m, 'nav-extra')).join('');
}

/* =========================================================
   VIEW: TAREFAS
========================================================= */
function renderTaskList(list, compact){
  if(!list.length) return emptyState('🍓','Nenhuma tarefa por aqui. Que tal adicionar uma?');
  return `<div class="list">${list.map(t=>`
    <div class="item ${t.done?'done':''}">
      <div class="check ${t.done?'checked':''}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</div>
      <div class="item-body">
        <div class="item-title ${t.done?'strike':''}">${esc(t.title)}</div>
        <div class="item-meta">${catTag(t.category)}${prioDot(t.priority)}<span class="tag" style="background:#F8EEF2;color:var(--text-soft)">📆 ${fmtDate(t.due)}</span></div>
      </div>
      ${compact? '' : `<div class="item-actions"><button class="icon-btn" onclick="deleteTask('${t.id}')">🗑️</button></div>`}
    </div>`).join('')}</div>`;
}

function viewTarefas(){
  const f = state.filters.tasks;
  let list = state.tasks;
  if(f==='hoje') list = list.filter(t=>t.due===todayISO());
  else if(f!=='todas') list = list.filter(t=>t.category===f);
  list = [...list].sort((a,b)=> a.done - b.done);
  const doneCount = state.tasks.filter(t=>t.done).length;

  return `
    <div class="card" style="margin-bottom:14px">
      <div class="progress-label"><span>Progresso geral</span><span>${doneCount}/${state.tasks.length} concluídas</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${state.tasks.length? Math.round(doneCount/state.tasks.length*100):0}%"></div></div>
    </div>
    <div class="chip-row scroller">
      ${chip('todas','Todas', f)}${chip('hoje','Hoje', f)}${chip('faculdade','🎓 Faculdade', f)}${chip('trabalho','💼 Trabalho', f)}${chip('pessoal','🌸 Pessoal', f)}${chip('financeiro','💰 Financeiro', f)}
    </div>
    <div class="chip-row scroller">
      <button class="btn btn-ghost btn-sm" onclick="clearCompletedTasks()">🧹 Limpar concluídas</button>
      <button class="btn btn-ghost btn-sm" onclick="clearAllTasks()">🗑️ Limpar tudo</button>
      <button class="btn btn-ghost btn-sm" onclick="goTab('historico')">🕰️ Ver histórico</button>
    </div>
    ${renderTaskList(list, false)}
    <button class="fab" onclick="openTaskForm()">+</button>
  `;
  function chip(id,label,active){ return `<button class="chip ${active===id?'active':''}" onclick="setTaskFilter('${id}')">${label}</button>`; }
}
function setTaskFilter(id){ state.filters.tasks = id; render(); }
function toggleTask(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.done = !t.done;
  if(t.done){ t.doneAt = todayISO(); state.game.stats.tasksDone++; gainXP(10, 'Tarefa concluída! +10 XP 🎉'); logHistory('✅', `Tarefa concluída: "${(t.title)}"`); }
  render();
}
function deleteTask(id){
  const t = state.tasks.find(x=>x.id===id);
  state.tasks = state.tasks.filter(x=>x.id!==id);
  if(t) logHistory('🗑️', `Tarefa removida: "${(t.title)}"`);
  render();
}
function clearCompletedTasks(){
  const done = state.tasks.filter(t=>t.done);
  if(!done.length){ showToast('Nenhuma tarefa concluída pra limpar 🍓'); return; }
  state.tasks = state.tasks.filter(t=>!t.done);
  logHistory('🧹', `Limpou ${done.length} tarefa(s) concluída(s)`);
  render(); showToast(`${done.length} tarefa(s) movida(s) pro histórico ✨`);
}
async function clearAllTasks(){
  if(!state.tasks.length){ showToast('Sua lista já está vazia 🍓'); return; }
  if(!(await uiConfirm('Tem certeza que quer apagar TODAS as tarefas (concluídas ou não)? Essa ação não pode ser desfeita.', 'Apagar tudo', true))) return;
  const n = state.tasks.length;
  state.tasks = [];
  logHistory('🧹', `Limpou todas as tarefas (${n})`);
  render(); showToast('Todas as tarefas foram removidas 🧹');
}

      </div>

}
function submitTask(){
  const title = document.getElementById('f_title').value.trim();
  if(!title){ showToast('Dá um título pra tarefa! 🍓'); return; }
  state.tasks.unshift({
    id:uid(), title,
    category: document.getElementById('f_cat').value,
    priority: document.getElementById('f_prio').value,
    due: document.getElementById('f_due').value || todayISO(),
    done:false
  });
  closeModal(); render(); showToast('Tarefa adicionada ✨');

        <div style="font-size:20px">${e.type==='academico'?'🎓':e.type==='profissional'?'💼':'🌸'}</div>
        <div class="item-body">
          <div class="item-title">${esc(e.title)}</div>

function deleteEvent(id){ state.events = state.events.filter(e=>e.id!==id); render(); }
function openEventForm(){
  openModal(`
    <div class="sheet-title"><h3>📅 Novo evento</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Título</label><input id="f_etitle" placeholder="Ex: Reunião de equipe"></div>

    </div>
    <div class="field-row">
      <div class="field"><label>Data</label><input type="date" id="f_edate" value="${todayISO()}"></div>

function submitEvent(){

    id:uid(), title,
    type: document.getElementById('f_etype').value,
    date: document.getElementById('f_edate').value || todayISO(),
    time: document.getElementById('f_etime').value || '09:00',
  });
  closeModal(); render(); showToast('Evento adicionado ✨');

function deleteSubject(id){ state.subjects = state.subjects.filter(s=>s.id!==id); render(); }
function toggleAssignment(sid,aid){
  const s = state.subjects.find(x=>x.id===sid); const a = s.assignments.find(x=>x.id===aid);
  a.done = !a.done;
  if(a.done){ a.doneAt = todayISO(); gainXP(15, 'Atividade concluída! +15 XP 🎓'); logHistory('🎓', `Atividade concluída: "${(a.title)}" (${(s.name)})`); }
  render();
}

  openModal(`
    <div class="sheet-title"><h3>🎓 Nova disciplina</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Nome da disciplina</label><input id="f_subj" placeholder="Ex: Cálculo I"></div>

}
function openAssignmentForm(sid){

    <div class="sheet-title"><h3>📄 Nova atividade</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <input type="hidden" id="f_asubj" value="${sid}">

      <div class="field"><label>Tipo</label><select id="f_atype"><option value="trabalho">📄 Trabalho</option><option value="prova">📝 Prova</option></select></div>

    </div>
    <button class="btn btn-primary btn-block" onclick="submitAssignment()">Adicionar atividade</button>
  `);

function submitAssignment(){

/* =========================================================
   VIEW: METAS
========================================================= */
function viewMetas(){
  const catIcon = {academica:'🎓', profissional:'💼', financeira:'💰', pessoal:'🌸'};
  const sorted = [...state.goals].sort((a,b)=> daysUntil(a.deadline)-daysUntil(b.deadline));
  return `
    <div class="list">
      ${sorted.map(g=>{
        const dleft = daysUntil(g.deadline);
        const urgent = dleft!==null && dleft<=7 && g.progress<100;
        return `
        <div class="card">
          <div class="card-title">
            <h3>${catIcon[g.category]||'🎯'} ${esc(g.title)}</h3>
            <button class="icon-btn" onclick="deleteGoal('${g.id}')">🗑️</button>
          </div>
          <div class="item-meta" style="margin-bottom:10px">
            ${catTag(g.category==='academica'?'faculdade':g.category==='financeira'?'financeiro':g.category)}
            <span class="tag" style="background:${urgent?'var(--danger-bg)':'#F8EEF2'};color:${urgent?'var(--danger)':'var(--text-soft)'}">${urgent?'⏰ ':''}${dleft>=0? 'Vence em '+dleft+' dias' : 'Prazo vencido'}</span>
          </div>
          <div class="progress-track"><div class="progress-fill ${g.progress===100?'mint':''}" style="width:${g.progress}%"></div></div>
          <div class="progress-label"><span>Progresso</span><span>${g.progress}%</span></div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="btn btn-ghost btn-sm" onclick="bumpGoal('${g.id}',-10)">-10%</button>
            <button class="btn btn-mint btn-sm" onclick="bumpGoal('${g.id}',10)">+10%</button>
          </div>
        </div>`;
      }).join('') || emptyState('🎯','Crie sua primeira meta e comece a evoluir!')}
    </div>
    <button class="fab" onclick="openGoalForm()">+</button>
  `;
}
function deleteGoal(id){ state.goals = state.goals.filter(g=>g.id!==id); render(); }
function bumpGoal(id, delta){
  const g = state.goals.find(x=>x.id===id);
  const old = g.progress;
  g.progress = Math.max(0, Math.min(100, g.progress+delta));
  if(g.progress===100 && old<100){ state.game.stats.goalsDone++; gainXP(30, 'Meta concluída! +30 XP 🏆'); logHistory('🏆', `Meta concluída: "${(g.title)}"`); }
  render();
}
function openGoalForm(){
  openModal(`
    <div class="sheet-title"><h3>🎯 Nova meta</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Título</label><input id="f_goal" placeholder="Ex: Aprender inglês"></div>
    <div class="field-row">
      <div class="field"><label>Categoria</label>
        <select id="f_gcat"><option value="pessoal">🌸 Pessoal</option><option value="academica">🎓 Acadêmica</option><option value="profissional">💼 Profissional</option><option value="financeira">💰 Financeira</option></select>
      </div>
      <div class="field"><label>Prazo</label><input type="date" id="f_gdate" value="${addDays(30)}"></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="submitGoal()">Criar meta</button>
  `);
}
function submitGoal(){
  const title = document.getElementById('f_goal').value.trim();
  if(!title){ showToast('Dá um título pra meta! 🎯'); return; }
  state.goals.push({id:uid(), title, category:document.getElementById('f_gcat').value, deadline:document.getElementById('f_gdate').value, progress:0});
  closeModal(); render(); showToast('Meta criada — vamos com tudo! ✨');
}

function exportData(){
  const blob = new Blob([JSON.stringify({app:'BerryLife', version:1, exportedAt:new Date().toISOString(), state}, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `berrylife-backup-${todayISO()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  showToast('Backup baixado 💾');
}
function importData(input){
  const file = input.files && input.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const data = JSON.parse(r.result); const st = data.state || data;
      if(!st || !Array.isArray(st.tasks)) throw new Error('formato');
      if(!(await uiConfirm('Isso vai substituir os dados atuais pelos do backup. Continuar?', 'Restaurar'))) return;
      localStorage.setItem(storageKey, JSON.stringify(st)); state = loadState(); lastSavedJSON=''; render(); showToast('Backup restaurado ✨');
    } catch(e){ uiAlert('Esse arquivo não parece ser um backup do BerryLife.'); }
  };
  r.readAsText(file);
}

  if(!(await uiConfirm('Carregar dados de exemplo? Seus dados atuais serão substituídos.', 'Carregar'))) return;

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
});
function installApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(()=>{ deferredInstallPrompt = null; });
  } else {
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if(isIOS){
      uiAlert('No iPhone/iPad: toque no ícone de compartilhar (□↑) na barra do Safari e escolha "Adicionar à Tela de Início".');
    } else {
      uiAlert('Abra o menu (⋮) do navegador e escolha "Instalar app" ou "Adicionar à tela inicial".');
    }
  }
}
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    const hadSW = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing; if(!nw) return;
        nw.addEventListener('statechange', () => {
          if(nw.state === 'activated' && hadSW) showToast('BerryLife atualizado! Recarregue para ver a nova versão 🍓');
        });
      });
    }).catch(()=>{});
  });
}

function mergeState(base, saved){
  const s = {...base, ...saved, tab:'inicio'};
  s.finance = {...base.finance, ...(saved.finance||{})};
  s.prefs = {...base.prefs, ...(saved.prefs||{})};
  s.filters = {...base.filters, ...(saved.filters||{})};
  s.health = {...base.health, ...(saved.health||{})};
  s.game = {...base.game, ...(saved.game||{})};
  s.game.stats = {...base.game.stats, ...((saved.game||{}).stats||{})};
  s.game.achievements = {...((saved.game||{}).achievements||{})};
  s.game.missionsDone = {...((saved.game||{}).missionsDone||{})};
  return s;
}
function daysBetween(a, b){ return Math.round((new Date(b+'T12:00') - new Date(a+'T12:00')) / 86400000); }

const LEVEL_TITLES = [[1,'Sementinha','🌱'],[2,'Broto','🌿'],[3,'Florzinha','🌸'],[5,'Moranguinho','🍓'],[7,'Berry Pro','💪'],[10,'Lenda Berry','👑']];
function levelTitle(level){ let t = LEVEL_TITLES[0]; for(const x of LEVEL_TITLES){ if(level >= x[0]) t = x; } return t; }

function streakInfo(){
  const g = state.game; if(!g || !g.lastActive) return {count:0, alive:false, today:false};
  const d = daysBetween(g.lastActive, todayISO());
  return {count: d <= 1 ? g.streak : 0, alive: d <= 1, today: d === 0};
}
function touchStreak(){
  const g = state.game, t = todayISO();
  if(g.lastActive === t) return;
  g.streak = (g.lastActive && daysBetween(g.lastActive, t) === 1) ? g.streak + 1 : 1;
  g.lastActive = t;
}

const MISSION_POOL = [
  {id:'tasks3', e:'✅', t:'Concluir 3 tarefas hoje', xp:20, goal:3, prog:s=>s.tasks.filter(t=>t.done && t.doneAt===todayISO()).length},
  {id:'workout', e:'🏋️', t:'Registrar um treino', xp:25, goal:1, prog:s=>s.health.workouts.filter(w=>w.date===todayISO()).length},
  {id:'weigh', e:'⚖️', t:'Registrar seu peso', xp:10, goal:1, prog:s=>s.health.weights.filter(w=>w.date===todayISO()).length},
  {id:'voice', e:'🎤', t:'Adicionar algo falando com o Berry', xp:15, goal:1, prog:s=>(s.game.voiceDay===todayISO()?1:0)},
  {id:'expense', e:'💰', t:'Anotar um gasto do dia', xp:10, goal:1, prog:s=>s.finance.transactions.filter(t=>t.date===todayISO()).length},
  {id:'study', e:'🎓', t:'Concluir uma atividade da faculdade', xp:20, goal:1, prog:s=>s.subjects.reduce((n,x)=>n+x.assignments.filter(a=>a.done && a.doneAt===todayISO()).length,0)},
];
function todaysMissions(){
  const d = todayISO(); let seed = 0; for(const c of d) seed = (seed*31 + c.charCodeAt(0)) % 9973;
  const pool = [...MISSION_POOL]; const out = [MISSION_POOL[0]]; pool.shift();
  while(out.length < 3){ seed = (seed*7 + 13) % 9973; out.push(pool.splice(seed % pool.length, 1)[0]); }
  return out.map(m => { const p = Math.min(m.goal, m.prog(state)); return {...m, p, ok: p >= m.goal}; });
}
function checkMissions(){
  const d = todayISO(); const done = state.game.missionsDone[d] || [];
  for(const m of todaysMissions()){
    if(m.ok && !done.includes(m.id)){
      done.push(m.id); state.user.xp += m.xp;
      logHistory('🎯', `Missão do dia cumprida: ${m.t}`);
      setTimeout(()=>showToast(`🎯 Missão cumprida! +${m.xp} XP`), 1500);
    }
  }
  state.game.missionsDone[d] = done;
}

function computeAlerts(){
  const t = todayISO(), al = [];
  const overdue = state.tasks.filter(x=>!x.done && x.due < t);
  const dueToday = state.tasks.filter(x=>!x.done && x.due === t);
  if(overdue.length) al.push({lv:3, e:'⏰', msg:`Você tem ${overdue.length} tarefa(s) atrasada(s). A mais antiga: "${overdue.sort((a,b)=>a.due.localeCompare(b.due))[0].title}".`, tab:'tarefas', btn:'Ver tarefas'});
  const evToday = state.events.filter(e=>e.date===t).sort((a,b)=>a.time.localeCompare(b.time));
  const now = new Date().toTimeString().slice(0,5);
  const nextEv = evToday.find(e=>e.time >= now);
  if(nextEv) al.push({lv:2, e:'📅', msg:`Hoje às ${nextEv.time}: ${nextEv.title}.`, tab:'agenda', btn:'Ver agenda'});
  const soon = [];
  state.subjects.forEach(s=>s.assignments.forEach(a=>{ if(!a.done){ const d = daysBetween(t, a.date); if(d>=0 && d<=3) soon.push({...a, subj:s.name, d}); } }));
  soon.sort((a,b)=>a.d-b.d);
  if(soon.length){ const a = soon[0]; al.push({lv: a.d<=1?3:2, e: a.type==='prova'?'📝':'🎓', msg:`${a.type==='prova'?'Prova':'Entrega'} de ${a.subj} ${a.d===0?'é hoje':a.d===1?'é amanhã':'em '+a.d+' dias'}: "${a.title}". Bora revisar?`, tab:'faculdade', btn:'Ver faculdade'}); }
  if(dueToday.length) al.push({lv:2, e:'✅', msg:`Faltam ${dueToday.length} tarefa(s) pra hoje. Comece por "${(dueToday.find(x=>x.priority==='alta')||dueToday[0]).title}".`, tab:'tarefas', btn:'Ver tarefas'});
  const st = streakInfo();
  if(st.count >= 2 && !st.today) al.push({lv:2, e:'🔥', msg:`Sua sequência de ${st.count} dias está em risco! Conclua qualquer coisa hoje pra manter.`, tab:'conquistas', btn:'Ver missões'});
  const h = state.health, wk = workoutsThisWeek();
  if(h.weeklyWorkouts){ const left = h.weeklyWorkouts - wk.length; const dow = (new Date().getDay()+6)%7; if(left > 0 && !h.workouts.some(w=>w.date===t)) al.push({lv: left > (7-dow) - 1 ? 2 : 1, e:'🏋️', msg:`Faltam ${left} treino(s) pra bater sua meta da semana (${h.weeklyWorkouts}). Que tal hoje?`, tab:'saude', btn:'Registrar treino'}); }
  if(h.goalKg){ const last = h.weights.length ? [...h.weights].sort((a,b)=>b.date.localeCompare(a.date))[0] : null; if(!last || daysBetween(last.date, t) >= 7) al.push({lv:1, e:'⚖️', msg:'Faz uma semana que você não registra o peso. Que tal se pesar hoje?', tab:'saude', btn:'Registrar peso'}); }
  state.goals.forEach(g=>{ if(g.progress<100){ const d = daysBetween(t, g.deadline); if(d>=0 && d<=7) al.push({lv:1, e:'🎯', msg:`A meta "${g.title}" vence em ${d} dia(s) e está em ${g.progress}%.`, tab:'metas', btn:'Ver metas'}); } });

  return al.sort((a,b)=>b.lv-a.lv);
}

const WORKOUT_TYPES = {musculacao:['🏋️','Musculação'], corrida:['🏃','Corrida'], caminhada:['🚶','Caminhada'], bike:['🚴','Bike'], funcional:['🔥','Funcional'], yoga:['🧘','Yoga'], natacao:['🏊','Natação']};
function weekStartISO(){ const d = new Date(); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function workoutsThisWeek(){ const ws = weekStartISO(); return state.health.workouts.filter(w=>w.date >= ws && w.date <= todayISO()); }
function healthStats(){
  const h = state.health; const ws = [...h.weights].sort((a,b)=>a.date.localeCompare(b.date));
  const cur = ws.length ? ws[ws.length-1].kg : null, start = ws.length ? ws[0].kg : null;
  const lost = cur!=null ? +(start-cur).toFixed(1) : 0;
  const totalToLose = (start!=null && h.goalKg) ? start - h.goalKg : 0;
  const goalPct = totalToLose > 0 ? Math.max(0, Math.min(100, Math.round(lost/totalToLose*100))) : 0;
  const bmi = (cur && h.heightCm) ? +(cur / Math.pow(h.heightCm/100, 2)).toFixed(1) : null;
  return {ws, cur, start, lost, goalPct, bmi};
}
function weightChart(ws, goal){
  const pts = ws.slice(-14); if(pts.length < 2) return emptyState('⚖️','Registre o peso pelo menos 2 vezes pra ver o gráfico');
  const W=1000,H=260,L=46,R=16,T=18,B=34;
  const vals = pts.map(p=>p.kg).concat(goal?[goal]:[]); let mn = Math.min(...vals)-1, mx = Math.max(...vals)+1;
  const x = i => L + i*(W-L-R)/(pts.length-1), y = v => T + (mx-v)*(H-T-B)/(mx-mn);
  const line = pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.kg).toFixed(1)}`).join(' ');
  const area = line + ` L${x(pts.length-1).toFixed(1)},${H-B} L${L},${H-B} Z`;
  const ticks = [mn, (mn+mx)/2, mx].map(v=>`<text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#9C7387">${v.toFixed(1)}</text><line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#F3DCE5" stroke-width="1"/>`).join('');
  const labels = pts.map((p,i)=> (i===0||i===pts.length-1||i%3===0) ? `<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#9C7387">${p.date.slice(8,10)}/${p.date.slice(5,7)}</text>` : '').join('');
  const g = goal ? `<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#7FCBA4" stroke-width="2" stroke-dasharray="6 5"/><text x="${W-R}" y="${y(goal)-6}" text-anchor="end" font-size="11.5" font-weight="700" fill="#2E8F5E">meta ${goal} kg</text>` : '';
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico do peso nas últimas pesagens">${ticks}${g}
    <path d="${area}" fill="var(--berry-light)" opacity=".45"/><path d="${line}" fill="none" stroke="var(--berry)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.kg)}" r="${i===pts.length-1?5:3.5}" fill="#fff" stroke="var(--berry)" stroke-width="2.5"/>`).join('')}${labels}</svg></div>`;
}

let voiceRec = null, voiceParsed = null;
function openVoice(){
  const hasSR = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  voiceParsed = null;
  openModal(`<div class="sheet-title"><h3>🎤 Fale com o Berry</h3><button class="close-x" onclick="stopVoice(); closeModal()">✕</button></div>
    ${hasSR ? `<button class="mic-big" id="micBig" onclick="toggleVoice()">🎤</button><p style="text-align:center;font-weight:800;color:var(--text-soft);font-size:13px" id="micHint">Toque e fale</p>`
            : `<p style="font-size:13px;font-weight:700;color:var(--text-soft)">Seu navegador não tem reconhecimento de voz. Escreva abaixo que o Berry entende do mesmo jeito.</p>`}
    <div class="transcript" id="voiceText"><span class="interim">${hasSR?'O que você falar aparece aqui…':''}</span></div>
    <div class="field"><input id="voiceInput" placeholder="ou escreva: amanhã prova de banco às 19h" onkeydown="if(event.key==='Enter') interpretVoice(this.value)"></div>
    <div id="voiceResult"><p class="examples"><b>Exemplos:</b> “amanhã tenho prova de banco de dados às 19h” · “gastei 35 reais no mercado” · “treinei 50 minutos de musculação” · “pesei 67,8 quilos” · “preciso entregar o relatório na sexta” · “recebi 300 reais de freela”</p></div>`);
  if(hasSR) setTimeout(toggleVoice, 250);
}
function toggleVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR) return;
  if(voiceRec){ stopVoice(); return; }
  voiceRec = new SR(); voiceRec.lang = 'pt-BR'; voiceRec.interimResults = true; voiceRec.continuous = false;
  let finalText = '';
  voiceRec.onresult = (ev) => {
    let interim = ''; finalText = '';
    for(const r of ev.results){ if(r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
    const box = document.getElementById('voiceText'); if(box) box.innerHTML = `${esc(finalText)}<span class="interim">${esc(interim)}</span>`;
  };
  voiceRec.onerror = (e) => { const hint = document.getElementById('micHint'); if(hint) hint.textContent = e.error === 'not-allowed' ? 'Permita o microfone no navegador' : 'Não entendi, tente de novo'; };
  voiceRec.onend = () => { const b = document.getElementById('micBig'); if(b) b.classList.remove('on'); const hint = document.getElementById('micHint'); if(hint && hint.textContent==='Ouvindo…') hint.textContent = 'Toque pra falar de novo'; voiceRec = null; if(finalText.trim()) interpretVoice(finalText); };
  try { voiceRec.start(); const b = document.getElementById('micBig'); if(b) b.classList.add('on'); const hint = document.getElementById('micHint'); if(hint) hint.textContent = 'Ouvindo…'; } catch(e){ voiceRec = null; }
}
function stopVoice(){ if(voiceRec){ try{ voiceRec.stop(); }catch(e){} } }

async function interpretVoice(text){
  text = (text||'').trim(); if(!text) return;
  const box = document.getElementById('voiceText'); if(box) box.textContent = text;
  const res = document.getElementById('voiceResult'); if(res) res.innerHTML = '<p class="examples">🍓 Berry está pensando…</p>';
  let parsed = null, src = 'regras';
  const ai = await aiInterpret(text);
  if(ai && ai.type){ parsed = ai; src = 'ia'; }
  if(!parsed) parsed = localInterpret(text);
  voiceParsed = parsed; showParsed(parsed, src);
}
async function aiInterpret(text){
  try {
    if(!Cloud.client || !Cloud.user || !CFG.AI_FUNCTION) return null;
    const ctrl = new AbortController(); const tm = setTimeout(()=>ctrl.abort(), 7000);
    const { data: sess } = await Cloud.client.auth.getSession();
    const r = await fetch(`${CFG.SUPABASE_URL}/functions/v1/${CFG.AI_FUNCTION}`, { method:'POST', signal: ctrl.signal,
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + sess.session.access_token, 'apikey': CFG.SUPABASE_ANON_KEY },
      body: JSON.stringify({ text, today: todayISO(), weekday: new Date().toLocaleDateString('pt-BR',{weekday:'long'}) }) });
    clearTimeout(tm); if(!r.ok) return null;
    const j = await r.json(); return normalizeParsed(j);
  } catch(e){ return null; }
}
function normalizeParsed(j){
  if(!j || !j.type) return null;
  const ok = ['tarefa','evento','gasto','entrada','treino','peso','meta']; if(!ok.includes(j.type)) return null;
  return { type:j.type, title: String(j.title||'').slice(0,120), date: /^\d{4}-\d{2}-\d{2}$/.test(j.date||'') ? j.date : todayISO(),
    time: /^\d{2}:\d{2}$/.test(j.time||'') ? j.time : '', amount: +j.amount || 0, category: j.category || '', minutes: +j.minutes || 0,
    workout: WORKOUT_TYPES[j.workout] ? j.workout : 'musculacao', kg: +j.kg || 0, priority: ['alta','media','baixa'].includes(j.priority) ? j.priority : 'media' };
}

/* ---- interpretador local (sem internet / sem IA) ---- */
const NUM_WORDS = {um:1,uma:1,dois:2,duas:2,'três':3,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,trezentos:300,quinhentos:500,mil:1000,meia:30};
function wordsToNumbers(t){
  return t.replace(/(?:(?<![\p{L}\d])(?=[\p{L}\d])|(?<=[\p{L}\d])(?![\p{L}\d]))((?:(?:um|uma|dois|duas|três|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|quatorze|catorze|quinze|dezesseis|dezessete|dezoito|dezenove|vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa|cem|cento|duzentos|trezentos|quinhentos|mil)(?:\s+e\s+|\s+)?)+)(?:(?<![\p{L}\d])(?=[\p{L}\d])|(?<=[\p{L}\d])(?![\p{L}\d]))/giu, m => {
    let total = 0, cur = 0;
    const parts = [];
    m.trim().split(/\s+e\s+|\s+/).forEach(w => { const v = NUM_WORDS[w.toLowerCase()]; if(v===undefined) return;
      if(v===1000){ total += (cur||1)*1000; cur = 0; return; }
      if(v>=10 && v<100 && (cur%100)!==0 && (cur%10)!==0 || (v<100 && cur%100>=10 && v>=10 && cur%10===0 && cur%100!==0)){ parts.push(total+cur); total = 0; cur = v; return; }
      cur += v; });
    parts.push(total + cur);
    return parts.join(' ') + ' ';
  });
}
function localInterpret(raw){
  let t = ' ' + wordsToNumbers(raw.toLowerCase()) + ' ';
  const out = { type:'tarefa', title:'', date: todayISO(), time:'', amount:0, category:'', minutes:0, workout:'musculacao', kg:0, priority:'media' };
  // data
  const wd = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  const wdAlt = {terca:2,sabado:6};
  if(/(?:(?<![\p{L}\d])(?=[\p{L}\d])|(?<=[\p{L}\d])(?![\p{L}\d]))depois de amanh[ãa](?:(?<![\p{L}\d])(?=[\p{L}\d])|(?<=[\p{L}\d])(?![\p{L}\d]))/u.test(t)){ out.date = addDays(2); t = t.replace(/(?:(?<![\p{L}\d])(?=[\p{L}\d])|(?<=[\p{L}\d])(?![\p{L}\d]))depois de amanh[ãa](?:(?<![\p{L}\d])(?=[\p{L}\d])|(?<=[\p{L}\d])(?![\p{L}\d]))/u,' '); }

function showParsed(p, src){
  const labels = {tarefa:'✅ Tarefa', evento:'📅 Evento', gasto:'💸 Gasto', entrada:'💵 Entrada', treino:'🏋️ Treino', peso:'⚖️ Peso', meta:'🎯 Meta'};
  const rows = [];
  rows.push(['O quê', labels[p.type]]);
  if(!['treino','peso'].includes(p.type)) rows.push(['Título', esc(p.title)]);
  if(['tarefa','evento','treino','peso','gasto','entrada'].includes(p.type)) rows.push(['Data', fmtDate(p.date)]);
  if(p.type==='meta') rows.push(['Prazo', fmtDate(p.date)]);
  if(p.time) rows.push(['Hora', p.time]);
  if(p.amount) rows.push(['Valor', fmtMoney(p.amount)]);
  if(p.category) rows.push(['Categoria', esc({academico:'Acadêmico',profissional:'Profissional',pessoal:'Pessoal',faculdade:'Faculdade',trabalho:'Trabalho',financeiro:'Financeiro'}[p.category]||p.category)]);
  if(p.type==='treino'){ rows.push(['Tipo', (WORKOUT_TYPES[p.workout]||['',p.workout]).join(' ')]); rows.push(['Duração', p.minutes + ' min']); }
  if(p.type==='peso') rows.push(['Peso', p.kg + ' kg']);
  const invalid = (p.type==='peso' && !(p.kg>20)) || ((p.type==='gasto'||p.type==='entrada') && !p.amount);
  document.getElementById('voiceResult').innerHTML = `
    <div class="parsed"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span class="k">Berry entendeu</span><span class="src-tag">${src==='ia'?'🤖 IA':'📏 regras locais'}</span></div>
      ${rows.map(([k,v])=>`<div class="row"><span style="color:var(--text-soft)">${k}</span><span>${v}</span></div>`).join('')}</div>
    ${invalid ? '<p class="examples" style="color:var(--danger)">Faltou um número (valor ou peso). Tente de novo dizendo, por exemplo, “gastei 20 reais no lanche”.</p>' : ''}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-primary" style="flex:1" ${invalid?'disabled':''} onclick="confirmVoice()">✔ Confirmar</button>
      <button class="btn btn-ghost" onclick="openVoice()">↺ Falar de novo</button></div>`;
}
function confirmVoice(){
  const p = voiceParsed; if(!p) return;
  state.game.stats.voice++; state.game.voiceDay = todayISO();
  let msg = 'Adicionado pelo Berry ✨';
  if(p.type==='tarefa'){ state.tasks.unshift({id:uid(), title:p.title, category:p.category||'pessoal', priority:p.priority||'media', due:p.date, done:false}); msg = 'Tarefa adicionada pelo Berry ✅'; }
  else if(p.type==='evento'){ state.events.push({id:uid(), title:p.title, type:p.category||'pessoal', date:p.date, time:p.time||'09:00'}); msg = 'Evento na agenda 📅'; }
  else if(p.type==='gasto' || p.type==='entrada'){ state.finance.transactions.unshift({id:uid(), type: p.type==='gasto'?'saida':'entrada', description:p.title, category:p.category||'Outros', amount:p.amount, date:p.date}); msg = p.type==='gasto' ? 'Gasto anotado 💸' : 'Entrada anotada 💵'; }
  else if(p.type==='meta'){ state.goals.push({id:uid(), title:p.title, category:'pessoal', deadline:p.date, progress:0}); msg = 'Meta criada 🎯'; }
  logHistory('🎤', `Pelo assistente: ${p.type} "${p.title}"`);
  closeModal();
  if(p.type==='treino'){ addWorkout(p.workout, p.minutes||45, p.date); }
  else if(p.type==='peso'){ addWeight(+p.kg.toFixed(1), p.date); }
  else { gainXP(5, msg + ' +5 XP'); }
  render();
}

/* =========================================================
   NUVEM: Supabase (contas + sincronização)
   Tabela: public.berry_state (user_id uuid PK, data jsonb, updated_at timestamptz) com RLS
========================================================= */
const CFG = window.BERRY_CONFIG || {};
const Cloud = {
  client: null, user: null, timer: null, status: 'local',
  get enabled(){ return !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase); },
  init(){
    if(!this.enabled) return false;
    this.client = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
    return true;
  },
  setStatus(st){
    this.status = st;
    const d = document.getElementById('syncDot'); if(!d) return;
    d.className = 'sync-dot ' + (st==='ok'?'':st);
    d.style.display = this.user ? '' : 'none';
  },
  schedule(){
    if(!this.user) return;
    clearTimeout(this.timer);
    this.setStatus(navigator.onLine ? 'saving' : 'offline');
    this.timer = setTimeout(()=>this.push(), 900);
  },
  async push(){
    if(!this.user || !navigator.onLine){ this.setStatus('offline'); return; }
    const {tab, ...data} = state;
    const { error } = await this.client.from('berry_state').upsert({ user_id: this.user.id, data, updated_at: new Date(state.updatedAt||Date.now()).toISOString() });
    this.setStatus(error ? 'error' : 'ok');
    if(error) console.warn('Erro ao sincronizar', error);
  },
  async pull(){
    const { data, error } = await this.client.from('berry_state').select('data, updated_at').eq('user_id', this.user.id).maybeSingle();
    if(error){ console.warn(error); this.setStatus('error'); return null; }
    return data;
  }
};
window.addEventListener('online', ()=>{ if(Cloud.user) Cloud.push(); });
window.addEventListener('offline', ()=>Cloud.setStatus('offline'));

async function enterAsUser(user){
  Cloud.user = user;
  storageKey = STORAGE_KEY + ':' + user.id;
  let local = loadState();
  // primeira vez nesta conta neste aparelho: aproveita os dados que já existiam sem conta
  if(!local){
    for(const k of [STORAGE_KEY + ':local', STORAGE_KEY]){ storageKey = k; local = loadState(); if(local) break; }
    storageKey = STORAGE_KEY + ':' + user.id;
    if(local) local.updatedAt = 0;
  }
  const remote = navigator.onLine ? await Cloud.pull() : null;
  const base = emptyState0();
  if(remote && remote.data && (!local || new Date(remote.updated_at).getTime() >= (local.updatedAt||0))){
    const r = remote.data;
    state = mergeState(base, r);
  } else if(local){
    state = local;
  } else {
    state = base;
  }
  if(!state.user.name){ state.user.name = (user.user_metadata && user.user_metadata.name) || (user.email||'').split('@')[0]; }
  hideAuth(); lastSavedJSON=''; render(); Cloud.setStatus('ok');
  if(!remote || !remote.data) Cloud.push();
}
function enterLocal(){
  Cloud.user = null;
  storageKey = STORAGE_KEY + ':local';
  try { if(!localStorage.getItem(storageKey) && localStorage.getItem(STORAGE_KEY)) localStorage.setItem(storageKey, localStorage.getItem(STORAGE_KEY)); localStorage.setItem('berrylife:mode','local'); } catch(e){}
  state = loadState() || emptyState0();
  hideAuth(); lastSavedJSON=''; render(); askName(); Cloud.setStatus('local');
}

/* ---------- Tela de autenticação ---------- */
let authMode = 'login';
function showAuth(mode){
  authMode = mode || authMode;
  const root = document.getElementById('authRoot');
  root.classList.add('show');
  const isLogin = authMode==='login', isSignup = authMode==='signup', isForgot = authMode==='forgot';
  root.innerHTML = `
  <div class="auth-wrap">
    <div class="auth-side">
      <div class="brand"><div class="brand-mark">🍓</div><div class="brand-name">BerryLife</div></div>
      <div>
        <h2>Sua vida organizada,<br>com leveza.</h2>
        <p class="lead">Tarefas, agenda, faculdade, trabalho, finanças e metas num só lugar — no celular e no computador.</p>
        <div class="feat"><span>✅</span>Tarefas e agenda do dia</div>
        <div class="feat"><span>💰</span>Controle financeiro simples</div>
        <div class="feat"><span>☁️</span>Sincroniza entre seus aparelhos</div>
        <div class="feat"><span>⭐</span>XP e níveis pra manter a constância</div>
      </div>
      <p style="font-size:12px; opacity:.75; font-weight:700;">Feito com carinho 💗</p>
    </div>
    <div class="auth-form">
      <div class="auth-mobile-brand"><div class="brand-mark">🍓</div><div class="brand-name">BerryLife</div></div>
      ${isForgot ? `
        <h3>Recuperar senha</h3>
        <p class="hint">Digite seu e-mail e enviaremos um link para criar uma nova senha.</p>
      ` : `
        <div class="seg"><button class="${isLogin?'on':''}" onclick="showAuth('login')">Entrar</button><button class="${isSignup?'on':''}" onclick="showAuth('signup')">Criar conta</button></div>
        <h3>${isLogin ? 'Que bom te ver! 🍓' : 'Crie sua conta ✨'}</h3>
        <p class="hint">${isLogin ? 'Entre para continuar de onde parou.' : 'Leva menos de um minuto e é grátis.'}</p>
      `}
      <div class="auth-msg" id="authMsg"></div>
      <form onsubmit="event.preventDefault(); submitAuth();" novalidate>
        ${isSignup ? `<div class="field"><label>Como quer ser chamada(o)?</label><input id="au_name" autocomplete="nickname" maxlength="40" placeholder="Ex.: Ana"></div>` : ''}
        <div class="field"><label>E-mail</label><input id="au_email" type="email" autocomplete="email" inputmode="email" placeholder="voce@email.com"></div>
        ${!isForgot ? `
        <div class="field"><label>Senha</label>
          <div class="pw-wrap"><input id="au_pass" type="password" autocomplete="${isSignup?'new-password':'current-password'}" placeholder="${isSignup?'Mínimo de 8 caracteres':'Sua senha'}" ${isSignup?'oninput="pwMeter(this.value)"':''}>
          <button type="button" onclick="togglePw('au_pass', this)" aria-label="Mostrar senha">👁️</button></div>
          ${isSignup ? '<div class="pw-meter"><i id="pwBar"></i></div>' : ''}
        </div>` : ''}
        ${isSignup ? `<div class="field"><label>Confirmar senha</label><input id="au_pass2" type="password" autocomplete="new-password" placeholder="Repita a senha"></div>` : ''}
        ${isLogin ? `<div style="text-align:right; margin:-4px 0 12px;"><button type="button" class="link-btn" onclick="showAuth('forgot')">Esqueci minha senha</button></div>` : ''}
        <button class="btn btn-primary btn-block" id="authBtn" type="submit" style="padding:13px">${isLogin?'Entrar':isSignup?'Criar conta':'Enviar link'}</button>
      </form>
      ${isForgot ? `<div style="text-align:center; margin-top:14px"><button class="link-btn" onclick="showAuth('login')">← Voltar para o login</button></div>` : `
      <div class="auth-or">ou</div>
      <button class="btn btn-ghost btn-block" onclick="enterLocal()">Usar sem conta (só neste aparelho)</button>`}
      <p class="auth-foot">Seus dados são privados: só você tem acesso a eles.</p>
    </div>
  </div>`;
  setTimeout(()=>{ const f = document.getElementById(isSignup?'au_name':'au_email'); if(f) f.focus(); }, 50);
}
function hideAuth(){ const r=document.getElementById('authRoot'); r.classList.remove('show'); r.innerHTML=''; }
function togglePw(id, b){ const i=document.getElementById(id); i.type = i.type==='password'?'text':'password'; b.textContent = i.type==='password'?'👁️':'🙈'; }
function pwMeter(v){
  let sc = 0; if(v.length>=8) sc++; if(v.length>=12) sc++; if(/[A-Z]/.test(v)&&/[a-z]/.test(v)) sc++; if(/\d/.test(v)) sc++; if(/[^A-Za-z0-9]/.test(v)) sc++;
  const b = document.getElementById('pwBar'); if(!b) return;
  b.style.width = (sc/5*100)+'%'; b.style.background = sc<=2 ? 'var(--danger)' : sc<=3 ? 'var(--gold)' : 'var(--mint)';
}
function authMsg(text, kind='err'){ const m=document.getElementById('authMsg'); if(m){ m.textContent=text; m.className='auth-msg '+kind; } }
function authErrorPt(err){
  const m = (err && (err.message||err.error_description||'')).toLowerCase();
  if(m.includes('invalid login')) return 'E-mail ou senha incorretos.';
  if(m.includes('email not confirmed')) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if(m.includes('already registered') || m.includes('already been registered')) return 'Esse e-mail já tem conta. Tente entrar.';
  if(m.includes('rate limit') || m.includes('too many')) return 'Muitas tentativas. Espere alguns minutos e tente de novo.';
  if(m.includes('password')) return 'A senha precisa ter pelo menos 8 caracteres.';
  if(m.includes('fetch') || m.includes('network')) return 'Sem conexão com a internet.';
  return 'Não foi possível concluir agora. Tente novamente.';
}
async function submitAuth(){
  if(!Cloud.client){ authMsg('O login ainda não foi configurado neste servidor.'); return; }
  const email = (document.getElementById('au_email').value||'').trim();
  const passEl = document.getElementById('au_pass'); const pass = passEl ? passEl.value : '';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return authMsg('Digite um e-mail válido.');
  const btn = document.getElementById('authBtn'); const label = btn.textContent; btn.disabled = true; btn.textContent = 'Aguarde…';
  try {
    if(authMode==='login'){
      if(!pass) return authMsg('Digite sua senha.');
      const { data, error } = await Cloud.client.auth.signInWithPassword({ email, password: pass });
      if(error) return authMsg(authErrorPt(error));
      await enterAsUser(data.user);
    } else if(authMode==='signup'){
      const name = (document.getElementById('au_name').value||'').trim();
      const pass2 = document.getElementById('au_pass2').value;
      if(!name) return authMsg('Diga como quer ser chamada(o).');
      if(pass.length < 8) return authMsg('A senha precisa ter pelo menos 8 caracteres.');
      if(pass !== pass2) return authMsg('As senhas não são iguais.');
      const { data, error } = await Cloud.client.auth.signUp({ email, password: pass, options:{ data:{ name }, emailRedirectTo: location.origin + location.pathname } });
      if(error) return authMsg(authErrorPt(error));
      if(data.session){ await enterAsUser(data.user); showToast('Conta criada! Bem-vinda(o) 🍓'); }
      else { showAuth('login'); authMsg('Conta criada! Enviamos um link de confirmação para ' + email + '. Depois é só entrar.', 'ok'); }
    } else {
      const { error } = await Cloud.client.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if(error) return authMsg(authErrorPt(error));
      authMsg('Se esse e-mail tiver conta, você vai receber o link em instantes. Confira também o spam.', 'ok');
    }
  } catch(e){ authMsg(authErrorPt(e)); }
  finally { const b=document.getElementById('authBtn'); if(b){ b.disabled=false; b.textContent=label; } }
}
function openNewPassword(){
  openModal(`
    <div class="sheet-title"><h3>🔑 Nova senha</h3></div>
    <div class="auth-msg" id="authMsg"></div>
    <div class="field"><label>Nova senha</label><input id="np1" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></div>
    <div class="field"><label>Confirmar</label><input id="np2" type="password" autocomplete="new-password"></div>
    <button class="btn btn-primary btn-block" onclick="saveNewPassword()">Salvar nova senha</button>`);
}
async function saveNewPassword(){
  const a=document.getElementById('np1').value, b=document.getElementById('np2').value;
  if(a.length<8) return authMsg('A senha precisa ter pelo menos 8 caracteres.');
  if(a!==b) return authMsg('As senhas não são iguais.');
  const { error } = await Cloud.client.auth.updateUser({ password:a });
  if(error) return authMsg(authErrorPt(error));
  closeModal(); showToast('Senha alterada 🔑');
}

/* ---------- Conta ---------- */
function openAccount(){
  const u = Cloud.user;
  const st = {ok:'☁️ Tudo salvo na nuvem', saving:'⏳ Salvando…', offline:'📴 Sem internet — salvo no aparelho, sincroniza quando voltar', error:'⚠️ Erro ao sincronizar — seus dados estão salvos no aparelho', local:'📱 Sem conta — dados só neste aparelho'}[Cloud.user ? Cloud.status : 'local'];
  openModal(`
    <div class="sheet-title"><h3>Minha conta</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="acct-head"><div class="avatar" style="display:flex;align-items:center;justify-content:center">${esc((state.user.name||'?').charAt(0).toUpperCase())}</div>
      <div><div class="acct-name">${esc(state.user.name||'Você')}</div><div class="acct-mail">${u ? esc(u.email) : 'Usando sem conta'}</div></div></div>
    <p style="font-size:13px; font-weight:700; color:var(--text-soft); margin-bottom:16px">${st}</p>
    <button class="btn btn-ghost btn-block" onclick="closeModal(); goTab('config')">⚙️ Configurações</button>
    ${u ? `<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="logout()">🚪 Sair da conta</button>`
        : (Cloud.client ? `<button class="btn btn-primary btn-block" style="margin-top:8px" onclick="closeModal(); localStorage.removeItem('berrylife:mode'); showAuth('signup')">☁️ Criar conta e sincronizar</button>` : '')}
  `);
}
async function logout(){
  if(!(await uiConfirm('Sair da sua conta neste aparelho?', 'Sair'))) return;
  await Cloud.push();
  try { localStorage.removeItem(storageKey); localStorage.removeItem('berrylife:mode'); } catch(e){}
  await Cloud.client.auth.signOut();
  Cloud.user = null; state = emptyState0(); storageKey = STORAGE_KEY; showAuth('login');
}

/* ---------- Inicialização ---------- */
async function boot(){
  const cloudOn = Cloud.init();
  if(!cloudOn){ // sem Supabase configurado: funciona só no aparelho
    storageKey = STORAGE_KEY; state = loadState() || emptyState0(); render(); askName(); Cloud.setStatus('local'); return;
  }
  Cloud.client.auth.onAuthStateChange((event) => {
    if(event === 'PASSWORD_RECOVERY') setTimeout(openNewPassword, 300);
  });
  const { data } = await Cloud.client.auth.getSession();
  if(data && data.session){ await enterAsUser(data.session.user); }
  else if(localStorage.getItem('berrylife:mode') === 'local'){ enterLocal(); }
  else { render(); showAuth('login'); }
}

/* =========================================================
   INIT
========================================================= */
boot();
</script>
